<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Night Shift Heist - a top-down stealth game with hand-written AI."
    />
    <title>Night Shift Heist</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23121826'/><circle cx='8' cy='8' r='3.5' fill='%2344cc66'/></svg>"
    />
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: #05070c;
        color: #cfd6e4;
        font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
        overflow: hidden;
      }

      #game {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
      }

      #game canvas {
        image-rendering: pixelated;
      }

      #boot-error {
        display: none;
        max-width: 34rem;
        margin: 4rem auto;
        padding: 1.25rem 1.5rem;
        border: 1px solid #33415c;
        border-radius: 6px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>

    <noscript>
      <div id="boot-error" style="display: block">
        <h1>JavaScript is disabled</h1>
        <p>Night Shift Heist needs JavaScript to run.</p>
      </div>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
